{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="narrow">
  <div class="page-heading"><p class="eyebrow">WELCOME BACK</p><h1>Login</h1><p>Access the participant area or administrator dashboard.</p></div>
  <form method="post" class="form-card">
    <label>Username<input name="username" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="button full" type="submit">Login</button>
    <p class="form-foot">New participant? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
